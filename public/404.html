<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | VelClick Agency</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFFFF;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 520px;
      padding: 40px 24px;
    }
    .logo {
      height: 60px;
      margin-bottom: 30px;
    }
    .code {
      font-family: 'Outfit', sans-serif;
      font-size: 80px;
      font-weight: 800;
      background: linear-gradient(100deg, #A97819, #F5D98B, #C18A25);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      line-height: 1;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      margin: 16px 0 12px;
    }
    p {
      color: #555555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(100deg, #A97819, #F5D98B, #C18A25);
      color: #111111;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(214, 165, 54, 0.25);
      transition: all 0.2s ease;
    }
    .btn:hover {
      box-shadow: 0 6px 20px rgba(214, 165, 54, 0.35);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo-tight.png" alt="VelClick Agency" class="logo" />
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved. Let's get you back to the home page.</p>
    <a href="/" class="btn">Return to Homepage</a>
  </div>
</body>
</html>
